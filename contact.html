<!DOCTYPE html>

<body class="contact-page">
    <div class="container">

        <footer>
            &copy; 2026 Luke Boppart. Built with love.

        <script>
            fetch('/partials/header.html')
                .then(res => res.text())
                .then(html => {

                        .getElementById('header-placeholder')
                        .innerHTML = html;
