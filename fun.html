<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Physics Bucket – Drop STL</title>
    <link rel="icon" href="assets/icons/page-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css?v=modernmaker-3">
</head>

<body class="fun-page">
    <div class="container">
        <header id="header-placeholder"></header>

        <main>
            <div class="controls">
                <label>Width: <input id="widthSlider" type="range" min="10" max="600" value="160" /></label>
                <label>Depth: <input id="depthSlider" type="range" min="10" max="600" value="160" /></label>
                <label>Height: <input id="heightSlider" type="range" min="5" max="1000" value="300" /></label>
                <button id="exportBtn">Export Scene STL</button>
                <input id="fileInput" type="file" accept=".stl" multiple hidden />
                <button id="importBtn">Import STL...</button>
                <button id="randomPackBtn">Random Pack</button>
            </div>
            <label class="switchLabel">
                Physics:
                <label class="switch">
                    <input type="checkbox" id="togglePhysicsCheckbox" checked>
                    <span class="slider round"></span>
                </label>
            </label>

            <section class="model-transform-panel" id="modelTransformPanel" aria-label="Selected model transform" aria-disabled="true">
                <div class="transform-panel-header">
                    <h3>Selected Model</h3>
                    <span id="selectedModelStatus">No model selected</span>
                </div>
                <div class="transform-groups">
                    <div class="transform-group">
                        <h4>Translate</h4>
                        <label>X <input id="translateXSlider" type="range" min="-300" max="300" step="1" value="0" disabled><output id="translateXValue">0</output></label>
                        <label>Y <input id="translateYSlider" type="range" min="0" max="1000" step="1" value="0" disabled><output id="translateYValue">0</output></label>
                        <label>Z <input id="translateZSlider" type="range" min="-300" max="300" step="1" value="0" disabled><output id="translateZValue">0</output></label>
                    </div>
                    <div class="transform-group">
                        <h4>Rotate</h4>
                        <label>X <input id="rotateXSlider" type="range" min="-180" max="180" step="1" value="0" disabled><output id="rotateXValue">0 deg</output></label>
                        <label>Y <input id="rotateYSlider" type="range" min="-180" max="180" step="1" value="0" disabled><output id="rotateYValue">0 deg</output></label>
                        <label>Z <input id="rotateZSlider" type="range" min="-180" max="180" step="1" value="0" disabled><output id="rotateZValue">0 deg</output></label>
                    </div>
                </div>
            </section>

            <div id="viewer"></div>
        </main>

        <div></div>

        <aside>
            <p>Drag and drop your .stl into the bucket. Click and drag objects to interact.</p>
        </aside>

        <footer>
            &copy; 2026 Luke Boppart. Built with love.
        </footer>
        <script>
            fetch('/partials/header.html')
                .then(res => res.text())
                .then(html => {
                    document
                        .getElementById('header-placeholder')
                        .innerHTML = html;
                });
        </script>
    </div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/",
        "three/utils/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/utils/",
        "cannon": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';
        import { STLExporter } from 'three/addons/exporters/STLExporter.js'
        import * as BufferGeometryUtils from 'three/utils/BufferGeometryUtils.js'
        import * as CANNON from 'cannon';

        const container = document.getElementById('viewer');
        const widthSlider = document.getElementById('widthSlider');
        const depthSlider = document.getElementById('depthSlider');
        const heightSlider = document.getElementById('heightSlider');
        const exportBtn = document.getElementById('exportBtn');
        const fileInput = document.getElementById('fileInput');
        const importBtn = document.getElementById('importBtn');
        const randomPackBtn = document.getElementById('randomPackBtn');

        const togglePhysicsCheckbox = document.getElementById('togglePhysicsCheckbox');
        const modelTransformPanel = document.getElementById('modelTransformPanel');
        const selectedModelStatus = document.getElementById('selectedModelStatus');
        const translateXSlider = document.getElementById('translateXSlider');
        const translateYSlider = document.getElementById('translateYSlider');
        const translateZSlider = document.getElementById('translateZSlider');
        const rotateXSlider = document.getElementById('rotateXSlider');
        const rotateYSlider = document.getElementById('rotateYSlider');
        const rotateZSlider = document.getElementById('rotateZSlider');
        const translateXValue = document.getElementById('translateXValue');
        const translateYValue = document.getElementById('translateYValue');
        const translateZValue = document.getElementById('translateZValue');
        const rotateXValue = document.getElementById('rotateXValue');
        const rotateYValue = document.getElementById('rotateYValue');
        const rotateZValue = document.getElementById('rotateZValue');
        const cameraNear = 0.1;
        const cameraFar = 12000;
        const maxCameraDistance = 5000;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, cameraNear, cameraFar);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.maxDistance = maxCameraDistance;
        camera.position.set(0, 550, 275);
        controls.update();

        const light = new THREE.HemisphereLight(0xffffff, 0x444444);
        scene.add(light);

        const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -98.2, 0) });
        let physicsEnabled = togglePhysicsCheckbox.checked;
        let selectedBody = null;
        let selectedObject = null;
        let selectionBox = null;
        let isEditingTransform = false;
        let dragPlane = null;
        let groundBody = null;
        let groundMesh = null;
        let lidBody = null;
        let lidMesh = null;
        let wallMeshes = [];
        let wallBodies = [];

        const physicsObjects = [];
        const mouse = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        let dragPointOffset = new THREE.Vector3();
        const transformOutputs = {
            translateX: translateXValue,
            translateY: translateYValue,
            translateZ: translateZValue,
            rotateX: rotateXValue,
            rotateY: rotateYValue,
            rotateZ: rotateZValue,
        };
        const transformInputs = [
            translateXSlider,
            translateYSlider,
            translateZSlider,
            rotateXSlider,
            rotateYSlider,
            rotateZSlider,
        ];
        const bucketSize = {
            width: +widthSlider.value,
            depth: +depthSlider.value,
            height: +heightSlider.value,
        };

        [widthSlider, depthSlider, heightSlider].forEach(slider => {
            slider.addEventListener('input', () => {
                const w = +widthSlider.value;
                const d = +depthSlider.value;
                const h = +heightSlider.value;
                bucketSize.width = w;
                bucketSize.depth = d;
                bucketSize.height = h;
                createWalls(w, d, h);
                updateTransformRanges();
            });
        });

        transformInputs.forEach(input => {
            input.addEventListener('pointerdown', startTransformEdit);
            input.addEventListener('focus', startTransformEdit);
            input.addEventListener('input', applyTransformControls);
            input.addEventListener('change', endTransformEdit);
            input.addEventListener('blur', endTransformEdit);
        });

        window.addEventListener('pointerup', endTransformEdit);

        function toDegrees(radians) {
            return THREE.MathUtils.radToDeg(radians);
        }

        function toRadians(degrees) {
            return THREE.MathUtils.degToRad(degrees);
        }

        function enableTransformControls(enabled) {
            modelTransformPanel.setAttribute('aria-disabled', String(!enabled));
            transformInputs.forEach(input => {
                input.disabled = !enabled;
            });
        }

        function updateTransformRanges() {
            translateXSlider.min = -bucketSize.width / 2;
            translateXSlider.max = bucketSize.width / 2;
            translateYSlider.min = 0;
            translateYSlider.max = bucketSize.height;
            translateZSlider.min = -bucketSize.depth / 2;
            translateZSlider.max = bucketSize.depth / 2;
        }

        function updateTransformOutputs() {
            transformOutputs.translateX.value = Math.round(+translateXSlider.value);
            transformOutputs.translateY.value = Math.round(+translateYSlider.value);
            transformOutputs.translateZ.value = Math.round(+translateZSlider.value);
            transformOutputs.rotateX.value = `${Math.round(+rotateXSlider.value)} deg`;
            transformOutputs.rotateY.value = `${Math.round(+rotateYSlider.value)} deg`;
            transformOutputs.rotateZ.value = `${Math.round(+rotateZSlider.value)} deg`;
        }

        function updateTransformControlsFromSelection() {
            if (!selectedObject) return;

            const { body, mesh } = selectedObject;
            mesh.position.copy(body.position);
            mesh.quaternion.copy(body.quaternion);

            translateXSlider.value = body.position.x;
            translateYSlider.value = body.position.y;
            translateZSlider.value = body.position.z;

            const rotation = new THREE.Euler().setFromQuaternion(mesh.quaternion, 'XYZ');
            rotateXSlider.value = toDegrees(rotation.x);
            rotateYSlider.value = toDegrees(rotation.y);
            rotateZSlider.value = toDegrees(rotation.z);
            updateTransformOutputs();
        }

        function updateSelectionBox() {
            if (!selectedObject) return;
            if (!selectionBox) {
                selectionBox = new THREE.BoxHelper(selectedObject.mesh, 0x24746f);
                scene.add(selectionBox);
            } else {
                selectionBox.setFromObject(selectedObject.mesh);
            }
            selectionBox.visible = true;
        }

        function setSelectedObject(object) {
            selectedObject = object;
            updateTransformRanges();
            enableTransformControls(Boolean(selectedObject));

            if (!selectedObject) {
                selectedModelStatus.textContent = 'No model selected';
                if (selectionBox) selectionBox.visible = false;
                return;
            }

            const selectedIndex = physicsObjects.indexOf(selectedObject) + 1;
            selectedModelStatus.textContent = `Model ${selectedIndex}`;
            updateTransformControlsFromSelection();
            updateSelectionBox();
        }

        function startTransformEdit() {
            if (!selectedObject) return;
            isEditingTransform = true;
            selectedObject.body.type = CANNON.Body.KINEMATIC;
            selectedObject.body.velocity.setZero();
            selectedObject.body.angularVelocity.setZero();
        }

        function endTransformEdit() {
            if (!selectedObject || !isEditingTransform) return;
            selectedObject.body.type = CANNON.Body.DYNAMIC;
            selectedObject.body.velocity.setZero();
            selectedObject.body.angularVelocity.setZero();
            isEditingTransform = false;
        }

        function applyTransformControls() {
            if (!selectedObject) return;

            startTransformEdit();

            const { body, mesh } = selectedObject;
            body.position.set(+translateXSlider.value, +translateYSlider.value, +translateZSlider.value);

            const rotation = new THREE.Euler(
                toRadians(+rotateXSlider.value),
                toRadians(+rotateYSlider.value),
                toRadians(+rotateZSlider.value),
                'XYZ'
            );
            mesh.position.copy(body.position);
            mesh.quaternion.setFromEuler(rotation);
            body.quaternion.set(mesh.quaternion.x, mesh.quaternion.y, mesh.quaternion.z, mesh.quaternion.w);
            body.velocity.setZero();
            body.angularVelocity.setZero();
            updateTransformOutputs();
            updateSelectionBox();
        }

        function createWalls(width, depth, height) {
            // Remove existing walls and ground
            wallMeshes.forEach(mesh => scene.remove(mesh));
            wallBodies.forEach(body => world.removeBody(body));
            if (groundMesh) scene.remove(groundMesh);
            if (groundBody) world.removeBody(groundBody);
            if (lidMesh) scene.remove(lidMesh);
            if (lidBody) world.removeBody(lidBody);
            wallMeshes = [];
            wallBodies = [];

            // Ground (visual + physics)
            const groundGeo = new THREE.PlaneGeometry(width, depth);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0xcccccf });
            groundMesh = new THREE.Mesh(groundGeo, groundMat);
            groundMesh.rotation.x = -Math.PI / 2;
            scene.add(groundMesh);

            const groundShape = new CANNON.Plane();
            groundBody = new CANNON.Body({ mass: 0 });
            groundBody.addShape(groundShape);
            groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
            world.addBody(groundBody);

            const wallDefs = [
                { pos: [0, height / 2, -depth / 2], rot: [0, 0, 0] },
                { pos: [0, height / 2, depth / 2], rot: [0, Math.PI, 0] },
                { pos: [-width / 2, height / 2, 0], rot: [0, Math.PI / 2, 0] },
                { pos: [width / 2, height / 2, 0], rot: [0, -Math.PI / 2, 0] },
            ];

            wallDefs.forEach(({ pos, rot }, index) => {
                const wallBody = new CANNON.Body({ mass: 0 });
                wallBody.addShape(new CANNON.Plane());
                wallBody.position.set(...pos);
                wallBody.quaternion.setFromEuler(...rot);
                world.addBody(wallBody);
                wallBodies.push(wallBody);

                const geo = new THREE.PlaneGeometry(index < 2 ? width : depth, height);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0xdddddd,
                    transparent: index === 1,

                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(...pos);
                mesh.rotation.set(...rot);
                scene.add(mesh);
                wallMeshes.push(mesh);
            });

            // Lid (invisible)
            const lidShape = new CANNON.Plane();
            lidBody = new CANNON.Body({ mass: 0 });
            lidBody.addShape(lidShape);
            lidBody.quaternion.setFromEuler(Math.PI / 2, 0, 0);
            lidBody.position.set(0, height, 0);
            world.addBody(lidBody);

            const lidGeo = new THREE.PlaneGeometry(width, depth);
            const lidMat = new THREE.MeshBasicMaterial({ visible: false });
            lidMesh = new THREE.Mesh(lidGeo, lidMat);
            lidMesh.rotation.x = Math.PI / 2;
            lidMesh.position.set(0, height, 0);
            scene.add(lidMesh);
        }

        function createBoxShapeFromGeometry(geometry) {
            geometry.computeBoundingBox();
            const box = geometry.boundingBox;
            const size = new THREE.Vector3();
            box.getSize(size);
            return new CANNON.Box(new CANNON.Vec3(size.x / 2, size.y / 2, size.z / 2));
        }

        function loadSTL(blob) {
            const loader = new STLLoader();
            const reader = new FileReader();
            reader.onload = function (e) {
                const geometry = loader.parse(e.target.result);
                geometry.rotateX(-Math.PI / 2);  // Align STL's Z-up to Y-up
                geometry.computeBoundingBox();

                const size = new THREE.Vector3();
                geometry.boundingBox.getSize(size);
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                geometry.translate(-center.x, -center.y, -center.z);

                const scale = 1;
                geometry.scale(scale, scale, scale);

                const material = new THREE.MeshNormalMaterial();
                const mesh = new THREE.Mesh(geometry, material);
                scene.add(mesh);

                const shape = createBoxShapeFromGeometry(geometry);
                const body = new CANNON.Body({ mass: 1 });
                body.addShape(shape);
                body.position.set((Math.random() - 0.5) * 5, 10, (Math.random() - 0.5) * 5);
                world.addBody(body);

                physicsObjects.push({ mesh, body });
                setSelectedObject(physicsObjects[physicsObjects.length - 1]);
            };
            reader.readAsArrayBuffer(blob);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (physicsEnabled) {
                world.step(1 / 60);

                for (const { mesh, body } of physicsObjects) {
                    mesh.position.copy(body.position);
                    mesh.quaternion.copy(body.quaternion);
                }
            }

            if (selectedObject) {
                if (!isEditingTransform) updateTransformControlsFromSelection();
                updateSelectionBox();
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function getMouseRayIntersection(e, plane) {
            const rect = container.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const point = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, point);
            return point;
        }

        importBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            Array.from(e.target.files)
                .filter(file => file.name.toLowerCase().endsWith('.stl'))
                .forEach(file => loadSTL(file));
            // clear the selection so the same file can be re-picked if needed
            e.target.value = '';
        });

        exportBtn.addEventListener('click', () => {
            const exporter = new STLExporter();
            const geometries = [];
            const importedMeshes = new Set();
            // collect only user-loaded meshes
            world.bodies.forEach(body => {
                if (body.shapes.length && body.shapes[0] instanceof CANNON.Box) {
                    const mesh = scene.children.find(obj => obj.isMesh && obj.geometry && obj.position.equals(body.position));
                    if (mesh) importedMeshes.add(mesh);
                }
            });

            scene.traverse(obj => {
                if (obj.isMesh && obj.geometry) {
                    const cloned = obj.geometry.clone();
                    obj.updateMatrix();
                    cloned.applyMatrix4(obj.matrix);
                    if (importedMeshes.has(obj)) geometries.push(cloned);
                }
            });

            if (geometries.length === 0) {
                alert('No meshes to export – load at least one .stl first.');
                return;
            }
            const normalized = geometries.map(g =>
                g.index ? g.toNonIndexed() : g
            );
            const merged = BufferGeometryUtils.mergeGeometries(geometries, false);
            if (!merged) {
                console.warn('Failed to merge geometries – check that you have at least one geometry, and that they all share the same attributes.');
                return;
            }
            const meshForExport = new THREE.Mesh(merged);
            meshForExport.rotation.x = Math.PI / 2;
            meshForExport.updateMatrixWorld(true);
            merged.rotateX(Math.PI / 2);
            const result = exporter.parse(new THREE.Mesh(merged));
            const blob = new Blob([result], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'scene.stl';
            link.click();
        });

        randomPackBtn.addEventListener('click', () => {
            // grab current bucket dims
            const w = +widthSlider.value;
            const d = +depthSlider.value;
            const h = +heightSlider.value;

            physicsObjects.forEach(({ mesh, body }) => {
                // random X/Z in bucket footprint
                const x = (Math.random() - 0.5) * w;
                const z = (Math.random() - 0.5) * d;
                // drop them from somewhere up to 80% of bucket height
                const y = Math.random() * (h * 0.8) + 5;
                body.position.set(x, y, z);
                body.velocity.setZero();
                body.angularVelocity.setZero();

                // optional: random orientation
                body.quaternion.setFromEuler(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    Math.random() * Math.PI
                );
            });
            if (selectedObject) updateTransformControlsFromSelection();
        });

        togglePhysicsCheckbox.addEventListener('click', () => {
            physicsEnabled = togglePhysicsCheckbox.checked;
        });

        // Drag-and-drop
        container.addEventListener('dragover', e => {
            e.preventDefault();
            container.classList.add('dragover');
        });
        container.addEventListener('dragleave', e => {
            e.preventDefault();
            container.classList.remove('dragover');
        });
        container.addEventListener('drop', e => {
            e.preventDefault();
            container.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.name.toLowerCase().endsWith('.stl')) {
                loadSTL(file);
            }
        });

        // Physics Drag
        container.addEventListener('mousedown', e => {
            const rect = container.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(physicsObjects.map(o => o.mesh));
            if (intersects.length > 0) {
                const intersect = intersects[0];
                const picked = physicsObjects.find(o => o.mesh === intersect.object);
                if (picked) {
                    setSelectedObject(picked);
                    selectedBody = picked.body;
                    selectedBody.type = CANNON.Body.KINEMATIC;
                    selectedBody.velocity.set(0, 0, 0);
                    controls.enabled = false;

                    const planeNormal = camera.getWorldDirection(new THREE.Vector3()).normalize();
                    dragPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(planeNormal, intersect.point);
                    dragPointOffset.copy(intersect.point).sub(selectedBody.position);
                }
            } else {
                setSelectedObject(null);
            }
        });
        container.addEventListener('mousemove', e => {
            if (!selectedBody || !dragPlane) return;
            const point = getMouseRayIntersection(e, dragPlane);
            point.sub(dragPointOffset);
            if (point.y < 0.5) point.y = 0.5;
            selectedBody.position.copy(point);
            updateTransformControlsFromSelection();
            updateSelectionBox();
        });
        container.addEventListener('mouseup', () => {
            if (selectedBody) {
                selectedBody.type = CANNON.Body.DYNAMIC;
                selectedBody.velocity.setZero();
                selectedBody.angularVelocity.setZero();
                selectedBody = null;
                dragPlane = null;
                controls.enabled = true;
            }
        });

        createWalls(160, 160, 300);
        animate();

    </script>
</body>

</html>
